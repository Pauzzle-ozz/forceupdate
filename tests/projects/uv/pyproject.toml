[project]
name = "demo-uv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "demo-lib",
]

[project.optional-dependencies]
cli = ["rich>=13"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
demo-lib = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/legacy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
